name: Update NHC tropical status

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official NHC status
        run: |
          curl --fail --silent --show-error --retry 3 \
            https://www.nhc.noaa.gov/CurrentStorms.json \
            --output /tmp/current-storms.json
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          source = Path('/tmp/current-storms.json')
          target = Path('data/current-storms.json')
          payload = json.loads(source.read_text())
          payload['_fetchedAt'] = datetime.now(timezone.utc).isoformat()
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Save changed status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current-storms.json
          git diff --cached --quiet && exit 0
          git commit -m "Update NHC tropical status"
          git push
